{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Q=new URLSearchParams(location.search);
const CAPTURE=Q.has('capture');
const $=id=>document.getElementById(id);
const VEX=2.5, SC=.62, PI=Math.PI, TAU=PI*2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), sat=x=>clamp(x,0,1), lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t), easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rand=(()=>{let s=1234567;return()=>{s=(s*16807)%2147483647;return s/2147483647;};})();
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const roman=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const [v,r] of m)while(n>=v){s+=r;n-=v;}return s;};

// ================================================================ data
const [geo,AUD,hImg,albedoTex,bumpTex]=await Promise.all([
  fetch('geo.json').then(r=>r.json()),fetch('audio.json').then(r=>r.json()),
  new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='height.png';}),
  new THREE.TextureLoader().loadAsync('albedo.jpg'),new THREE.TextureLoader().loadAsync('bump.png')]);
await Promise.race([document.fonts.load('700 64px Cinzel','ABC'),new Promise(r=>setTimeout(r,4000))]);
const W=geo.W,H=geo.H,HN=512;
const hx=(()=>{const c=document.createElement('canvas');c.width=c.height=HN;const x=c.getContext('2d');x.drawImage(hImg,0,0);return x.getImageData(0,0,HN,HN).data;})();
const HEI=new Float32Array(HN*HN),WAT=new Float32Array(HN*HN);
for(let i=0;i<HN*HN;i++){HEI[i]=((hx[i*4]*256+hx[i*4+1])/10-20)/100*VEX;WAT[i]=hx[i*4+2]/255;if(WAT[i]>.35)HEI[i]-=.55*sat((WAT[i]-.35)/.4);}
function sampleArr(A,x,z){const u=(x/W+.5)*(HN-1),v=(z/H+.5)*(HN-1);if(u<0||v<0||u>HN-1||v>HN-1)return 0;
  const i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j,i1=Math.min(i+1,HN-1),j1=Math.min(j+1,HN-1);
  return lerp(lerp(A[j*HN+i],A[j*HN+i1],fu),lerp(A[j1*HN+i],A[j1*HN+i1],fu),fv);}
const gY=(x,z)=>sampleArr(HEI,x,z), wAt=(x,z)=>sampleArr(WAT,x,z);
const PLATE_R=k=>k==='ntuh'?8.4:6.75;                 // turntable radius in site-local units
{ // level a pad for every site so the turntable sits flush in the ground, then feather back into the hills
  const SCl=.62;
  for(const h of geo.hosp){const [cx,cz]=h.p;const R=Math.max((PLATE_R(h.k)+.6)*SCl+.5,(PLATE_R(h.k)+.6)*1.46*SCl+.35);
    let sum=0,n=0;for(let a=0;a<36;a++)for(const r of [0,.4,.8].map(f=>f*R)){sum+=gY(cx+Math.cos(a/36*TAU)*r,cz+Math.sin(a/36*TAU)*r);n++;}
    const Hs=Math.max(.06,sum/n);h.Hs=Hs;const R2=R+3.2;
    for(let j=0;j<HN;j++)for(let i=0;i<HN;i++){const x=(i/(HN-1)-.5)*W,z=(j/(HN-1)-.5)*H;const d=Math.hypot(x-cx,z-cz);if(d>R2+(h.k==='vgh'?1.5:0))continue;
      const f=d<R?1:1-ease(sat((d-R)/(R2-R)));const k=j*HN+i;HEI[k]=lerp(HEI[k],Hs,f);if(d<R)WAT[k]=0;}}
}

// ================================================================ renderer
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:false,powerPreference:'high-performance',preserveDrawingBuffer:CAPTURE});
renderer.setPixelRatio(Math.min(devicePixelRatio,CAPTURE?1:1.5));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0c0907);scene.fog=new THREE.FogExp2(0x0c0907,.0042);
const camera=new THREE.PerspectiveCamera(36,16/9,.12,2600);
const pmrem=new THREE.PMREMGenerator(renderer);
{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='env_rgbe.png';});
 const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const px=x.getImageData(0,0,c.width,c.height).data;
 const f=new Float32Array(c.width*c.height*4);for(let k=0;k<c.width*c.height;k++){const e=px[k*4+3];const sc=e?Math.pow(2,e-136):0;f[k*4]=px[k*4]*sc;f[k*4+1]=px[k*4+1]*sc;f[k*4+2]=px[k*4+2]*sc;f[k*4+3]=1;}
 const tex=new THREE.DataTexture(f,c.width,c.height,THREE.RGBAFormat,THREE.FloatType);tex.flipY=true;tex.mapping=THREE.EquirectangularReflectionMapping;tex.colorSpace=THREE.LinearSRGBColorSpace;tex.needsUpdate=true;
 scene.environment=pmrem.fromEquirectangular(tex).texture;tex.dispose();}

// ================================================================ shader plumbing (map lies inside a sphere + weathering)
const U={uBowl:{value:new THREE.Vector2()},uCurve:{value:.0017},uTime:{value:0},uBeat:{value:0},uEnergy:{value:0}};
const GLSL_NOISE=`
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p*=2.03;a*=.5;}return s;}
`;
function curved(mat,extra){
  mat.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,{uBowl:U.uBowl,uCurve:U.uCurve,uTime:U.uTime,uBeat:U.uBeat,uEnergy:U.uEnergy});
    sh.vertexShader='uniform vec2 uBowl;uniform float uCurve;uniform float uTime;uniform float uBeat;uniform float uEnergy;varying vec3 vWP;varying float vLY;varying vec3 vLP;\n'+sh.vertexShader
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvLY=position.y;vLP=position;')
      .replace('#include <project_vertex>',`
        vec4 mvPosition=vec4(transformed,1.0);
        #ifdef USE_INSTANCING
          mvPosition=instanceMatrix*mvPosition;
        #endif
        vec4 cwp=modelMatrix*mvPosition; vWP=cwp.xyz; vec2 cdd=cwp.xz-uBowl; cwp.y+=uCurve*dot(cdd,cdd);
        mvPosition=viewMatrix*cwp; gl_Position=projectionMatrix*mvPosition;`)
      .replace('#include <worldpos_vertex>',`
        vec4 worldPosition=vec4(transformed,1.0);
        #ifdef USE_INSTANCING
          worldPosition=instanceMatrix*worldPosition;
        #endif
        worldPosition=modelMatrix*worldPosition; vec2 cdw=worldPosition.xz-uBowl; worldPosition.y+=uCurve*dot(cdw,cdw);`);
    sh.fragmentShader='uniform float uTime;uniform float uBeat;uniform float uEnergy;varying vec3 vWP;varying float vLY;varying vec3 vLP;\n'+GLSL_NOISE+sh.fragmentShader;
    if(extra)extra(sh);
  };
  return mat;
}
// weathered walls: panel-to-panel tint, rain streaks, grime at the foot, blotches
function weather(k=1){return (sh)=>{
  sh.fragmentShader=sh.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
    { vec3 wp=vWP; float hz=wp.x+wp.z*0.83;
      float panel=h21(floor(vec2(hz/0.17,wp.y/0.13)));
      float streak=smoothstep(.5,.95,vn(vec2(hz*55.,wp.y*1.6)))*smoothstep(.2,.8,vn(vec2(hz*7.,wp.y*.9)));
      float blot=fbm(vec2(hz*3.1,wp.y*2.4)+wp.zx*.7);
      float foot=smoothstep(0.,1.1,vLY);
      float edge=smoothstep(.0,.6,fbm(vec2(hz*40.,wp.y*40.)));
      diffuseColor.rgb*= (0.86+0.22*panel*${(.6*k).toFixed(2)}+0.14) * (1.-0.32*streak*${k.toFixed(2)}) * mix(0.62,1.,foot) * (0.82+0.3*blot);
      diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(0.9,1.0,0.88),0.25*(1.-blot)*${k.toFixed(2)});
    }`).replace('#include <roughnessmap_fragment>',`#include <roughnessmap_fragment>
    roughnessFactor=clamp(roughnessFactor*(0.75+0.5*fbm(vec2((vWP.x+vWP.z)*9.,vWP.y*6.))),0.04,1.);`);
};}
function chain(...fs){return sh=>fs.forEach(f=>f&&f(sh));}

// ================================================================ procedural textures
function canvasTex(w,h,draw,srgb=true,rep=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;if(rep)t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;}
const grime=canvasTex(512,512,(x,S)=>{x.fillStyle='#c9c9c9';x.fillRect(0,0,S,S);
  for(let i=0;i<5200;i++){const r=.6+Math.random()*Math.random()*16;const v=Math.random()<.55?60+Math.random()*70:200+Math.random()*55;x.fillStyle=`rgba(${v},${v},${v},${.015+Math.random()*.045})`;x.beginPath();x.arc(Math.random()*S,Math.random()*S,r,0,7);x.fill();}
  for(let i=0;i<500;i++){x.strokeStyle=`rgba(255,255,255,${Math.random()*.16})`;x.lineWidth=.4+Math.random();x.beginPath();const a=Math.random()*S,b=Math.random()*S;x.moveTo(a,b);x.lineTo(a+(Math.random()-.5)*70,b+(Math.random()-.5)*10);x.stroke();}},false);
const std=(o,ex)=>curved(new THREE.MeshStandardMaterial(o),ex);
const metal=(color,rough=.5,m=.88)=>std({color,metalness:m,roughness:rough,map:grime,roughnessMap:grime,envMapIntensity:.75});
const M={
  bronze:metal(0xc6a46a,.66), brass:metal(0xd5b06c,.5), dark:metal(0x6a573a,.85), copper:metal(0xb87048,.58),
  pewter:metal(0xa49d88,.6), iron:metal(0x5d5850,.75,.8), steel:metal(0x9a968c,.45,.9),
  frame:std({color:0x56493a,metalness:.8,roughness:.42,map:grime,roughnessMap:grime},weather(.5)),
  frameLt:std({color:0x8a8072,metalness:.7,roughness:.4,map:grime,roughnessMap:grime},weather(.5)),
  stone:std({color:0x978a74,metalness:.05,roughness:.82,map:grime,bumpMap:grime,bumpScale:.6},weather(1)),
  conc:std({color:0x9b9384,metalness:.05,roughness:.88,map:grime,bumpMap:grime,bumpScale:.8},weather(1.2)),
  paleTrim:std({color:0xb9ab90,metalness:.05,roughness:.7,map:grime},weather(.8)),
  ring:std({color:0x7d6542,metalness:.8,roughness:.82,map:grime,roughnessMap:grime,envMapIntensity:.4}),
  roofTar:std({color:0x3b3631,metalness:.1,roughness:.95,map:grime},weather(.6)),
  wood:std({color:0x5d3f27,metalness:.05,roughness:.8}),
};
M.glow=curved(new THREE.MeshBasicMaterial({color:0xffa955}));
// glass with lit offices / blinds per cell
M.glass=curved(new THREE.MeshPhysicalMaterial({color:0x7a909b,metalness:.12,roughness:.18,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.1}),(sh)=>{
  sh.fragmentShader=sh.fragmentShader.replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
    { vec2 cell=floor(vec2((vLP.x+vLP.z)/0.46,vLY/0.42)); float r=h21(cell+floor(vWP.xz*.3)); float lit=step(.86,r);
      float fy=fract(vLY/0.42); float inner=smoothstep(.08,.16,fy)*smoothstep(.95,.85,fy);
      totalEmissiveRadiance+= vec3(1.0,.66,.36)*inner*(lit*(0.1+0.3*uEnergy)*(0.6+0.4*h21(cell+3.3))+0.01);
      diffuseColor.rgb*=0.96+0.08*h21(cell+9.1);}`);
});
// facade textures (one window bay x one storey per tile)
function facade(kind){
  const map=canvasTex(512,512,(x,S)=>{
    if(kind==='brick'){x.fillStyle='#4a2a1f';x.fillRect(0,0,S,S);
      const bh=16,bw=46;for(let r=0;r<S/bh;r++)for(let c=-1;c<S/bw+1;c++){const o=(r%2)*bw/2;const v=Math.random();
        x.fillStyle=`hsl(${12+v*10},${38+v*18}%,${24+Math.random()*16}%)`;x.fillRect(c*bw+o+2,r*bh+2,bw-4,bh-4);
        if(Math.random()<.2){x.fillStyle='rgba(0,0,0,.25)';x.fillRect(c*bw+o+2,r*bh+2,bw-4,bh-4);}}
      // arched window w/ stone dressing
      x.fillStyle='#c9b893';x.beginPath();x.moveTo(140,450);x.lineTo(140,190);x.arc(256,190,116,PI,0);x.lineTo(372,450);x.fill();
      x.fillStyle='#151110';x.beginPath();x.moveTo(164,440);x.lineTo(164,195);x.arc(256,195,92,PI,0);x.lineTo(348,440);x.fill();
      x.strokeStyle='#5e5446';x.lineWidth=7;x.beginPath();x.moveTo(256,105);x.lineTo(256,440);x.moveTo(164,280);x.lineTo(348,280);x.stroke();
      x.fillStyle='#d6c7a3';x.fillRect(124,446,264,22);x.fillRect(240,70,32,40);
      x.fillStyle='#b7a582';x.fillRect(0,496,S,16);
    }else if(kind==='stone'){x.fillStyle='#a8977a';x.fillRect(0,0,S,S);
      for(let r=0;r<8;r++)for(let c=0;c<4;c++){const v=Math.random();x.fillStyle=`hsl(38,${18+v*10}%,${50+v*14}%)`;x.fillRect(c*128+((r%2)*64)%128+3,r*64+3,122,58);}
      x.fillStyle='#d8caa8';x.fillRect(118,96,276,26);x.fillRect(110,402,292,22);
      x.fillStyle='#1a1512';x.fillRect(146,122,220,278);
      x.strokeStyle='#6a5d4a';x.lineWidth=8;x.strokeRect(146,122,220,278);x.beginPath();x.moveTo(256,122);x.lineTo(256,400);x.moveTo(146,230);x.lineTo(366,230);x.stroke();
    }else if(kind==='tile'){x.fillStyle='#8a8378';x.fillRect(0,0,S,S);
      for(let r=0;r<S/12;r++)for(let c=0;c<S/24;c++){const v=Math.random();x.fillStyle=`hsl(30,${6+v*8}%,${44+v*16}%)`;x.fillRect(c*24+1,r*12+1,22,10);}
      x.fillStyle='#16130f';x.fillRect(60,150,392,250);x.strokeStyle='#cfc6b4';x.lineWidth=10;x.strokeRect(60,150,392,250);
      x.lineWidth=6;for(let k=1;k<4;k++){x.beginPath();x.moveTo(60+k*98,150);x.lineTo(60+k*98,400);x.stroke();}
      x.fillStyle='#bfb6a4';x.fillRect(40,400,432,18);
    }
    for(let i=0;i<900;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*.06})`;x.fillRect(Math.random()*S,Math.random()*S,2+Math.random()*6,1+Math.random()*3);}

function camRaw(t){let k=0;while(k<K.length-2&&K[k+1].t<=t)k++;const a=K[k],b=K[k+1];const h=b.t-a.t;const s=sat((t-a.t)/h);
  const a0=K[Math.max(k-1,0)],b1=K[Math.min(k+2,K.length-1)];
  const herm=(f)=>{const p0=f(a),p1=f(b);const m0=f(b).clone().sub(f(a0)).multiplyScalar(h/Math.max(b.t-a0.t,1e-3));const m1=f(b1).clone().sub(f(a)).multiplyScalar(h/Math.max(b1.t-a.t,1e-3));
    const s2=s*s,s3=s2*s;return p0.clone().multiplyScalar(2*s3-3*s2+1).add(m0.multiplyScalar(s3-2*s2+s)).add(p1.clone().multiplyScalar(-2*s3+3*s2)).add(m1.multiplyScalar(s3-s2));};
  return {p:herm(q=>q.p),l:herm(q=>q.l),ap:lerp(a.ap,b.ap,ease(s))};}
const GW=[];{let s=0,s2=0;for(let k=-16;k<=16;k++){const w=Math.exp(-(k*k)/(2*3.6*3.6)),w2=Math.exp(-(k*k)/(2*7*7));GW.push([k*.075,w,w2]);s+=w;s2+=w2;}GW.forEach(g=>{g[1]/=s;g[2]/=s2;});}
function camAt(t){const p=V(),l=V();let ap=0;for(const [dt,w,w2] of GW){const c=camRaw(clamp(t+dt,0,DUR));p.addScaledVector(c.p,w);l.addScaledVector(c.l,w2);ap+=c.ap*w;}return {p,l,ap};}

// ================================================================ HUD
const credit=$('credit'),meta=$('meta'),travel=$('travel'),titleEl=$('title');let hudSite=-1;
const SHORTN=['VGH','SHIN KONG','MACKAY','NTUH','CATHAY','WAN FANG','TSGH'];
function setHud(i){if(hudSite===i)return;hudSite=i;const h=H7[i];
  $('cSm').textContent=`MEDICAL CENTER · ${DIST[i].toUpperCase()} DISTRICT · EST. ${h.y}`;$('cBig').textContent=EN_NAME[i];$('cFeat').textContent=FEAT[i];
  meta.innerHTML=`${String(i+1).padStart(2,'0')} / 07<br><b>${h.lat.toFixed(4)}°N &nbsp;${h.lon.toFixed(4)}°E</b><br>ELEVATION ${Math.round(h.elev)} M`;}
function hud(t){let si=-1;for(let i=0;i<7;i++)if(t>=SEG[i]&&t<SEG[i+1])si=i;
  if(si>=0){setHud(si);const T0=SEG[si],T1=SEG[si+1];const a=sat((t-(T0+3.1))/.6)*sat((T1-.9-t)/.6);credit.style.opacity=a;meta.style.opacity=a*.95;credit.style.transform=`translateY(${(1-a)*6}px)`;
    if(si>0){const ta=sat((t-T0)/.3)*sat((T0+3.0-t)/.4);const km=H7[si-1].dn*easeIO(sat((t-T0+.05)/2.9));travel.style.opacity=ta;travel.innerHTML=`${SHORTN[si-1]} → ${SHORTN[si]}<b>${km.toFixed(2)} KM</b>`;}else travel.style.opacity=0;}
  else{credit.style.opacity=0;meta.style.opacity=0;travel.style.opacity=0;}
  const tt=sat((t-TITLE_IN)/1.2)*sat((FADE_OUT+.6-t)/1.0);titleEl.style.opacity=tt;titleEl.style.transform=`scale(${1+Math.max(0,t-TITLE_IN)*.006})`;titleEl.style.transformOrigin='50% 50%';}

// ================================================================ frame update
const tmpV=V();
function update(t){
  const e=energy(t),bp=beatPulse(t);
  U.uTime.value=t;U.uBeat.value=bp;U.uEnergy.value=sat(e*1.6);grade.uniforms.uTime.value=t;
  const c=camAt(clamp(t,0,DUR));const gmin=gY(c.p.x,c.p.z)+.9;if(c.p.y<gmin&&t>SEG[0])c.p.y=gmin;
  camera.position.copy(c.p);camera.lookAt(c.l);U.uBowl.value.set(c.l.x,c.l.z);
  if(window.__override){camera.position.copy(window.__override.P);camera.lookAt(window.__override.C);U.uBowl.value.set(window.__override.C.x,window.__override.C.z);}
  const dx=c.p.x-c.l.x,dz=c.p.z-c.l.z;camera.position.y+=U.uCurve.value*(dx*dx+dz*dz);camera.updateMatrixWorld();
  const fd=camera.position.distanceTo(c.l);bokeh.enabled=dofOn;bokeh.uniforms.focus.value=fd;bokeh.uniforms.aperture.value=.00022*c.ap*(30/Math.max(fd,4));bokeh.uniforms.maxblur.value=.014;
  scene.fog.density=lerp(.0042,.0016,sat((camera.position.y-14)/30));
  key.target.position.copy(c.l);key.position.copy(c.l).add(tmpV.set(-38,58,26));rim.target.position.copy(c.l);rim.position.copy(c.l).add(tmpV.set(30,20,-40));
  for(const m of facadeMats)m.emissiveIntensity=.05+e*.6+bp*.15;
  M.glow.color.setHSL(.08,.9,.55+bp*.2);
  // astrolabe
  sunLight.intensity=0;astro.visible=t<T_START+4;
  // hospitals — parts rise LINEARLY (mechanical, no bounce)
  let si=-1;for(let i=0;i<7;i++)if(t>=SEG[i]&&t<SEG[i+1])si=i;
  for(const v of HOLES.rb)v.z=0;for(const st of sites)for(const v of st.plz.userData.sl)v.z=-Math.abs(v.z);
  sites.forEach((s,i)=>{const T0=SEG[i];const local=t-(T0+1.4);s.local=local;segProg[i]=sat(local/4.6);s.root.visible=true;
    if(!s.root.visible)return;
    for(const p of s.parts){const ud=p.userData;const st=ud.start??(ud.follow.userData.start+.35);
      if(ud.slot){const su=ud.opt&&ud.opt.iris?sat((local-ud.opt.irisAt)/1.45):sat((local-(st-.9))/.85);ud.slot(su);if(su>0&&ud.hole)ud.hole();}
      const u=sat((local-st)/ud.dur);
      if(ud.opt&&ud.opt.grow){p.visible=u>.001;p.scale.set(1,Math.max(.001,ease(u)),1);continue;}
      const ue=ud.opt&&ud.opt.ease==='smooth'?u*u*u*(u*(u*6-15)+10):u;p.visible=u>.001;p.position.y=ud.y0-ud.h*(1-ue);if(ud.opt&&ud.opt.twist)p.rotation.y=-ud.opt.twist*(1-ue);}
    if(s.spin)s.spin.rotation.y=t*1.5+ratchet(t,2)*.5;
    if(s.lamp){s.lamp.visible=local>3.5;}
    if(s.bell)s.bell.rotation.z=Math.sin(t*5)*.35*bp;
    const lu=sat((local-.9)/1.6);s.lbl.position.y=s.P.y-.7+lu*.75;s.lbl.visible=lu>0;});
  for(const m of mechs)if(m.vis())m.update(t);
  if(si>=0){siteLight.position.copy(HP[si]).add(tmpV.set(-4,2.2,5));siteLight.intensity=5*(.6+e)*sat((t-SEG[si]-2)/2);}else siteLight.intensity=0;
  tapes.forEach((tp,k)=>{const u=sat((t-SEG[k+1]+.1)/2.9);const ev=easeIO(u);tp.mesh.geometry.setDrawRange(0,Math.floor(ev*tp.count/6)*6);tp.pins.children.forEach((p,j)=>{p.visible=u>0&&ev>=(j+1)*10/((tp.n+1)*10);});});
  beams.forEach((b,i)=>{const a=sat((t-T_END-.3-i*.18)/.6)*(1-sat((t-FADE_OUT)/1.2));b.material.opacity=a*(.22+bp*.12);b.visible=a>0;b.scale.y=Math.max(.001,easeIO(sat((t-T_END-.3-i*.18)/1.0)));});
  grade.uniforms.uFade.value=sat((t-.15)/.9)*(1-sat((t-FADE_OUT)/1.2));
  hud(t);
}

// ================================================================ loop / audio / UI
function resize(){const f=$('frame');const w=f.clientWidth,h=f.clientHeight;for(const m of (typeof VAPS!=='undefined'?VAPS:[]))m.uniforms.uScale.value=h*renderer.getPixelRatio()*.5/Math.tan(camera.fov*PI/360);renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const audio=new Audio('music.mp3');audio.preload='auto';
let playing=false,tManual=parseFloat(Q.get('t')||'0');const T=()=>playing?audio.currentTime:tManual;
const wave=$('wave'),wx=wave.getContext('2d');
function drawWave(t){const r=wave.getBoundingClientRect(),dpr=devicePixelRatio||1;if(wave.width!==Math.round(r.width*dpr)){wave.width=Math.round(r.width*dpr);wave.height=Math.round(r.height*dpr);}
  const w=wave.width,h=wave.height;wx.clearRect(0,0,w,h);const n=Math.floor(w/(3*dpr));
  for(let i=0;i<n;i++){const tt=i/n*DUR;const v=AUD.env[Math.floor(tt*30)]||0;const bh=Math.max(1.5*dpr,v*h*.8);wx.fillStyle=tt<=t?'#d8b06a':'#5a4a33';wx.fillRect(i*3*dpr,(h-bh)/2,2*dpr,bh);}
  wx.fillStyle='#a88b5a';wx.font=`${9*dpr}px Cinzel, serif`;for(let i=0;i<7;i++){const x=SEG[i]/DUR*w;wx.fillRect(x,0,dpr,h*.18);if(w>520*dpr)wx.fillText(SHORTN[i],x+3*dpr,9*dpr);}
  wx.fillStyle='#fff3d6';wx.fillRect(t/DUR*w,0,1.5*dpr,h);const s=Math.floor(t);$('tc').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} / 1:41`;}
function seek(t){t=clamp(t,0,DUR-.05);tManual=t;audio.currentTime=t;}
wave.addEventListener('pointerdown',e=>{const r=wave.getBoundingClientRect();seek((e.clientX-r.left)/r.width*DUR);});
function setPlay(p){playing=p;if(p){audio.currentTime=tManual;audio.play().catch(()=>{playing=false;});}else{tManual=audio.currentTime;audio.pause();}$('pp').textContent=playing?'❚❚':'▶';}
$('pp').onclick=()=>{$('start').style.display='none';setPlay(!playing);};
$('dofbtn').onclick=()=>{dofOn=!dofOn;$('dofbtn').textContent=dofOn?'DOF ON':'DOF OFF';};
audio.addEventListener('ended',()=>{playing=false;tManual=DUR;$('pp').textContent='▶';});
$('go').disabled=false;$('go').textContent='▶  PLAY';$('load').textContent='BEST WITH HEADPHONES, FULL SCREEN';
$('go').onclick=()=>{$('start').style.display='none';seek(0);setPlay(true);try{$('stage').requestFullscreen?.();}catch(e){}};
let hideT=0;const bar=$('bar');addEventListener('pointermove',()=>{bar.classList.remove('hide');hideT=performance.now();});
if(CAPTURE){$('start').style.display='none';bar.style.display='none';}
function frame(){const t=T();update(t);composer.render();drawWave(t);if(playing&&performance.now()-hideT>2500)bar.classList.add('hide');if(!CAPTURE)requestAnimationFrame(frame);}
window.__render=(t,mode)=>{update(t);if(mode==='raw')renderer.render(scene,camera);else if(mode==='nodof'){bokeh.enabled=false;composer.render();}else composer.render();return true;};window.__ready=true;window.__sites=sites;window.__camera=camera;window.__composer=composer;window.__bokeh=bokeh;window.__cam=(t)=>{const c=camAt(t);return [c.p.x,c.p.y,c.p.z,c.l.x,c.l.y,c.l.z];};
if(!CAPTURE)frame();else{update(tManual);composer.render();}
